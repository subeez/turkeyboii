<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tail feathers (fan behind) -->
  <ellipse cx="100" cy="60" rx="45" ry="55" fill="#FF8C42" opacity="0.8"/>
  <path d="M 60 70 Q 50 30 70 10" stroke="#FFB347" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 80 55 Q 70 10 85 -5" stroke="#FF6B35" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 100 50 Q 100 5 105 -15" stroke="#FFC300" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 120 55 Q 130 10 115 -5" stroke="#FF8C42" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 140 70 Q 150 30 130 10" stroke="#FFB347" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Body (brown) -->
  <ellipse cx="100" cy="115" rx="35" ry="45" fill="#8B4513"/>
  
  <!-- Head (small circle, brown/tan) -->
  <circle cx="100" cy="60" r="20" fill="#A0522D"/>
  
  <!-- Snood (red/cranberry dangly under head) -->
  <path d="M 95 78 Q 92 95 95 105" stroke="#8B0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Wattle (left side of head) -->
  <ellipse cx="82" cy="75" rx="6" ry="10" fill="#CC5500"/>
  
  <!-- Beak (yellow-orange) -->
  <polygon points="110,58 125,62 110,66" fill="#FFC300"/>
  
  <!-- Eye (small black dot) -->
  <circle cx="108" cy="55" r="3" fill="#000"/>
  
  <!-- Wing detail on body -->
  <path d="M 70 110 Q 65 125 70 140" stroke="#654321" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 130 110 Q 135 125 130 140" stroke="#654321" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Legs (thin brown) -->
  <line x1="90" y1="155" x2="88" y2="185" stroke="#654321" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="155" x2="112" y2="185" stroke="#654321" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Feet (small claws) -->
  <g stroke="#654321" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="85" y1="185" x2="80" y2="195"/>
    <line x1="88" y1="185" x2="93" y2="195"/>
    <line x1="90" y1="185" x2="90" y2="196"/>
    
    <line x1="115" y1="185" x2="120" y2="195"/>
    <line x1="112" y1="185" x2="107" y2="195"/>
    <line x1="110" y1="185" x2="110" y2="196"/>
  </g>
</svg>